# ---------------------------------------------------------------------------
# 2. What It Is & What It Covers
# ---------------------------------------------------------------------------
summary:
  description: |
    CESM is a LinkML-based information standard and data transformation
    toolkit for multi-energy system modeling. It defines a common schema
    for representing energy systems (nodes, units, links, storage, temporal
    structure, investment parameters) and provides bidirectional data
    transformers between CESM and multiple modeling tools. The intended
    users are energy system modelers who work with multiple tools and need
    to move datasets between them, and tool developers who want their model
    to interoperate with others through a common data standard.

  modeling_domains_supported: |
    - Multi-energy/sector coupling (electricity, heat, gas, hydrogen, biomass,
      and other carriers — also material flows with the caveat that unit
      annotations are energy-based)
    - Capacity expansion (nodal/zonal): investment modeling with multi-period
      planning, discount rates, payback times, period-dependent costs, and
      group-level aggregate investment constraints
    - Production cost (nodal/zonal): unit commitment with linear or integer
      startup methods, startup costs, constant or piecewise-linear efficiency
      curves, availability time series, and operational costs
    - Storage modeling: dedicated Storage node class with state-of-charge
      tracking, charging/discharging, self-discharge losses, and investment
    - Network representation (nodal/zonal): bidirectional transfer corridors
      with directional efficiency/capacity, transfer costs, and investment

  what_does_it_NOT_cover: |
    - AC/DC power flow (no impedance, voltage, reactive power, or power flow
      equations — network transfer is capacity-constrained linear flow)
    - Dynamic and transient stability
    - Distribution-level modeling
    - Building energy modeling (beyond aggregate demand profiles or simple
      storages)
    - Transportation energy (beyond aggregate demand or storage)
    - Stochastic/probabilistic analysis (design goal, not yet implemented)

  data_captured: |
    - Network topology (nodes, links between nodes, ports connecting units
      to nodes)
    - Device parameters (efficiency curves, startup costs, capacity, existing
      units, availability time series)
    - Storage parameters (capacity, self-discharge, investment costs)
    - Investment costs and financial parameters (discount rates, payback
      times, currency, reference year, inflation)
    - Time series (flow profiles, availability, profile limits)
    - Temporal structure (timeline, periods, solve patterns with rolling
      horizons, representative periods, nested solves)
    - System constraints (groups, generic constraints with coefficients)
    - Geographic coordinates (latitude/longitude on nodes and units)

  conceptual_structure: |
    Entity-relationship with a graph-like topology. Nodes (Balance, Storage,
    Commodity) are connected via Links (bidirectional transfer) and via Units
    (conversion devices) through typed Ports (Node_to_unit, Unit_to_node).
    Shared behaviors are factored into mixins (HasFlow, HasPenalty,
    HasInvestments, HasProfiles). The schema is defined in LinkML, which
    provides inheritance, mixins, and typed attributes with annotations.

# ---------------------------------------------------------------------------
# 3. Key Design Decisions
# ---------------------------------------------------------------------------
design:
  key_decisions:
    - decision: Specification is separate from implementation
      rationale: >
        Allows the same schema to be consumed by multiple tools and
        serialized in multiple formats (YAML, DuckDB, Spine DB, CSV).
    - decision: Avoid domain specificity — units convert energy/matter generically
      rationale: >
        No need for the specification to separately define heat pumps, gas
        turbines, etc. They just have different parametrization. Keeps the
        specification tractable and avoids long compatibility lists.
    - decision: Methods make modeling choices explicit (e.g., conversion_method, startup_method)
      rationale: >
        Methods define what parameters are required and allow validation of
        parameter completeness. A model can declare which methods it
        supports, making incompatibilities detectable before runtime.
    - decision: Nodes do not declare which commodity they carry
      rationale: >
        Commodity association is implicit through port connections. This
        keeps the specification flexible and domain-agnostic, and avoids
        requiring redundant commodity declarations on every node.
    - decision: Single definition for single thing (e.g., either efficiency or heat rate, not both)
      rationale: >
        Makes life easier for the transformers — no ambiguity about which
        parameter to use.
    - decision: Hub-and-spoke transformer architecture
      rationale: >
        Each tool needs only one transformer (to/from CESM) rather than
        N x (N-1) point-to-point converters.

  schema_format: |
    LinkML (YAML-based schema definition language). Generates Pydantic
    models for Python type safety and validation. The schema supports
    YAML serialization, JSON Schema export, and RDF/OWL mappings.

  implementation_languages:
    - Python

  database_storage_backend: |
    DuckDB as the primary interchange hub (columnar, metadata-preserving).
    SQLite via Spine DB and GridDB writers. CSV with JSON metadata sidecar.

  interoperability:
    imports_from:
      - reads IRENA FlexTool datasets from Spine DB (SQLite)
      - reads GridDB / Sienna datasets from SQLite
      - reads CESM YAML (native LinkML format)
      - reads CSV directories with metadata
    exports_to:
      - exports to IRENA FlexTool Spine DB format
      - exports to GridDB / Sienna SQLite format
      - exports to generic Spine DB format
      - exports to CSV
      - exports to DuckDB

  data_tool_relation: Data only

  extensibility: |
    The schema is extended by editing the LinkML YAML file and regenerating
    Python classes. New methods (e.g., a new ConversionMethod) can be added
    to enumerations without breaking existing functionality. New tool
    transformers are added by creating a versioned directory with YAML-based
    declarative mappings and/or Python transformation logic. The transformer
    framework supports config-driven transformations (renaming, filtering,
    mathematical operations, dimension reordering) without custom code.

  units_handling: |
    Explicit per-field via QUDT annotations. Each numeric attribute carries
    qudt.ucum_code and qudt.unit annotations (e.g., unit:MegaW-HR,
    unit:PERCENT). Currency slots use ISO 4217 codes with a dataset-level
    reference year for real-terms monetary values. Percentages are expressed
    as whole numbers (38.0 for 38%), not fractions.

  validation_approach: |
    Schema structure validation via LinkML (type checking, enum constraints,
    required fields, regex patterns for durations and currency codes).
    A custom validation script checks YAML structure, required top-level
    fields, expected classes, and SchemaView compatibility. Referential
    integrity (e.g., port source/sink must reference existing entities) is
    documented but not enforced at the schema level — it is left to runtime
    checks by transformers. No physical consistency checks (e.g., convexity)
    at the schema level. A full validation module to be added (that considers
    what makes up a valid dataset for energy/power system modelling).

  governance: |
    Contributions to the specification must be carefully vetted — best to
    open an issue first. Transformer contributions are more straightforward
    via pull requests.

# ---------------------------------------------------------------------------
# 4. Real-World Usage
# ---------------------------------------------------------------------------
usage:
  tools_built_on_schema:
    - tool: IRENA FlexTool
      relationship: Bidirectional data transformer (CESM <-> FlexTool)
      link: https://github.com/irena-flextool/flextool
    - tool: GridDB / Sienna
      relationship: Bidirectional data transformer (CESM <-> GridDB)
      link: ~
    - tool: Spine Toolbox
      relationship: Workflow orchestration with predefined CESM transformation pipelines
      link: https://github.com/spine-tools/Spine-Toolbox

  largest_real_world_dataset: |
    A GridDB example model: ~250-node power system with 154 generation units,
    94 balance nodes, 121 transmission links, and 8784-timestep (full year
    hourly) time series. Stored in DuckDB, successfully transformed
    bidirectionally between CESM and FlexTool/GridDB formats.

  who_is_using_it: |
    Just out of oven - needs more transformers, a schema extension to power
    system specific parameters as well as to results that could be transferred
    between models.

  data_available: Not yet used for this purpose - could be.


# ---------------------------------------------------------------------------
# 5. Limitations & Challenges
# ---------------------------------------------------------------------------
challenges:
  known_limitations:
    - No AC/DC power flow — zonal/nodal with capacity-constrained linear transfer only
    - No stochastic/probabilistic analysis support yet (design goal)
    - Referential integrity not enforced at schema level (runtime checks only)
    - Variable time resolution not yet implemented (planned)
    - Early version (v0.1.0) — schema may evolve with breaking changes before stabilization

  hardest_problems_encountered: |
    Designing a schema generic enough to represent multiple energy carriers
    and multiple modeling tools without becoming so abstract that it loses
    semantic precision. The balance between "one-size-fits-all" and
    "captures domain-specific detail" is the core ongoing challenge.
    The explicit methods approach (ConversionMethod, StartupMethod, etc.)
    was the key design choice that made this tractable — it allows the
    schema to be precise about what a model needs without being prescriptive
    about how it implements it.

# ---------------------------------------------------------------------------
# 6. Interoperability & Convergence
# ---------------------------------------------------------------------------
interoperability:
  areas_of_overlap_with_other_schemas: |
    CESM is designed as a hub format for interchange between tools that
    may use other schemas internally. It overlaps with GridDB/Sienna in
    covering generation units, transmission, and time series, but differs
    in supporting multi-energy carriers and investment modeling. It
    complements IEC-CIM rather than competing — CIM covers detailed
    electrical network data while CESM covers planning-level parameters.
    CESM should cover at least power flow related parameters, but could
    also be extended further to power grid simulations.

  what_would_convergence_require: |
    CESM's hub-and-spoke architecture means it is inherently designed to
    connect to other schemas via transformers rather than replacing them.
    Convergence would mainly require agreeing on a common entity naming
    and taxonomy, and ensuring that the core concepts (nodes, units, links,
    temporal structure) map cleanly between schemas. CESM's approach of
    explicit methods and single-definition-per-concept should be considered
    in any convergence effort — it significantly simplifies transformer
    development.

  biggest_thing_others_should_know: |
    CESM is not a tool — it is a data standard with transformers. It does
    not generate models or solve anything. Its value is in being the
    interchange layer that lets different tools share datasets without
    custom point-to-point converters. The hub-and-spoke architecture means
    adding support for a new tool requires only one transformer (to/from
    CESM), not N-1 converters to every other tool.

