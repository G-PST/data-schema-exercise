  tools_built_on_schema:
    - tool: PowerSystems.jl
      relationship: Julia implementation of the Sienna data model for power system analysis
      link: https://github.com/NREL-Sienna/PowerSystems.jl
    - tool: PowerSimulations.jl
      relationship: Production cost modeling and optimization using Sienna data
      link: https://github.com/NREL-Sienna/PowerSimulations.jl
    - tool: PowerSimulationsDynamics.jl
      relationship: Dynamic simulation using Sienna data
      link: https://github.com/NREL-Sienna/PowerSimulationsDynamics.jl
    - tool: PowerFlows.jl
      relationship: Power flow analysis using Sienna data
      link: https://github.com/NREL-Sienna/PowerFlows.jl
    - tool: PowerSystemsInvestmentsPortfolios.jl
      relationship: Capacity expansion data management using Sienna investment schemas
      link: https://github.com/NREL-Sienna/PowerSystemsInvestmentsPortfolios.jl
    - tool: PowerSystemsInvestments.jl
      relationship: Capacity expansion optimization using Sienna data
      link: https://github.com/NREL-Sienna/PowerSystemsInvestments.jl
    - tool: power-openapi-models (Python)
      relationship: Auto-generated Pydantic models from SiennaSchemas
      link: ~

  largest_real_world_dataset: |
    Specific real-world datasets are subject to CEII restrictions, but the schema has been
    used with full nodal models of US interconnections for production cost mostly. The adoption of
    expansion data has been tested as a PoC but currently limited to synthetic datasets. The schema
    is designed to scale to the largest real-world datasets used in production cost and
     capacity expansion modeling in Q2, Q3 of 2026.

  who_is_using_it:
    - "NLR for capacity expansion planning research"
    - "US DOE-funded national laboratory research programs like NTP"
    - "GenX.jl is developing integration via PowerSystemsInvestmentsPortfolios"
    - "Academic researchers using the Sienna platform"

  data_available:
    - geographic_area: US test systems
      content: |
        Standard IEEE test systems, RTS-GMLC (Reliability Test System),
        and synthetic network models. Parsers support PSS/E, MATPOWER, and
        PowerWorld formats for loading existing datasets.
      access: public
    - geographic_area: US Western and Eastern Interconnects
      content: |
        Production cost modeling datasets derived from NLR studies.
      access: ceii_or_nda

# ---------------------------------------------------------------------------
# 5. Limitations & Challenges
# ---------------------------------------------------------------------------
challenges:
  known_limitations:
    - "Electricity only — no multi-energy/sector coupling (gas, heat, hydrogen)"
    - "No distribution-level modeling (no phase detail, no split-phase)"
    - "JSON column validation in SiennaGridDB not yet fully implemented"
    - "Dynamic model library is limited to a subset of standard models and needs to be expanded for broader applicability"

  hardest_problems_encountered: |
    Designing a schema that is simultaneously rigorous enough for type-safe
    code generation across multiple languages and flexible enough to
    accommodate the diversity of power systems modeling domains (operations,
    investments, dynamics). The key insight was separating the schema
    specification (JSON Schema) from implementations (Julia, Python, SQL),
    using code generation to maintain consistency while allowing each
    language to provide idiomatic interfaces. Maintaining backward
    compatibility across auto-generated implementations while evolving the
    schema remains an ongoing challenge.

    A particularly hard problem is preserving unit-level identity across
    modeling granularities. Production cost models routinely aggregate
    generators into plant-level or zonal representations for computational
    tractability, but power flow analysis requires individual unit
    parameters. Without an explicit relationship layer (like plant objects),
    the mapping between aggregated and disaggregated representations is
    lost, making it impossible to round-trip between power flow and
    production cost workflows on the same dataset. The supplemental
    attribute pattern in PowerSystems.jl addresses this; bringing it into
    SiennaSchemas and SiennaGridDB is an active priority.

# ---------------------------------------------------------------------------
# 6. Interoperability & Convergence
# ---------------------------------------------------------------------------
interoperability:
  areas_of_overlap_with_other_schemas: |
    Overlap with GenX in capacity expansion resource modeling — GenX is
    actively developing integration via PowerSystemsInvestmentsPortfolios
    (which is the Julia specific implementation of the schema in the Sienna
    platform similar to PowerSystems.jl). Overlap with PyPSA in component-based
    bus-centric topology, cost curve
    representation, and operational parameters. Overlap with CIM/ENTSO-E in
    equipment modeling and topology representation, though Sienna focuses on
    planning/analysis rather than multi-organization exchange. CESM has
    developed a bidirectional transformer to/from SiennaGridDB, demonstrating
    that the Sienna data model can serve as a spoke in CESM's hub-and-spoke
    interchange architecture.

    A key area where Sienna differs from most other schemas in this
    comparison is the explicit modeling of plant-level groupings via
    supplemental attributes. Most schemas (GenX, PyPSA, CESM) treat
    generators as independent entities without representing the physical
    plant structure (shared shafts, penstocks, HRSGs, points of common
    coupling). This information is critical for workflows that move between
    power flow (unit-level) and production cost (aggregated) representations
    — without it, disaggregating results back to individual units after an
    aggregated solve requires ad-hoc assumptions.

  what_would_convergence_require: |
    The Sienna architecture is explicitly designed for convergence: the
    language-agnostic JSON Schema specification means any tool can generate
    compatible types in its own language, and the SQLite database backend is
    universally accessible. Critically, the schema imposes no type hierarchy,
    so adopters do not need to restructure their internal abstractions to
    conform — they only need to map flat component definitions onto their
    existing data model. This makes incremental adoption practical: a tool
    can start by mapping a few component types and expand over time without
    an all-or-nothing commitment. Convergence with other schemas would
    require agreeing on a common component taxonomy, attribute naming
    conventions, and unit conventions. The CESM transformer already
    demonstrates this path.

  biggest_thing_others_should_know: |
    The Sienna Data Model is not a Julia library — it is a language-agnostic
    JSON Schema specification with automated code generation for Python,
    Julia, and SQL. PowerSystems.jl is one implementation, not the schema
    itself. The schema deliberately imposes no type hierarchy: component
    definitions are flat and self-contained, so adopters can map them onto
    their existing abstractions without restructuring their codebase. Any
    team can adopt SiennaSchemas in their language of choice without
    touching Julia and without conforming to an imposed object model. The
    SQLite database (SiennaGridDB) is accessible from every major
    programming language, making it a practical interchange format today.

