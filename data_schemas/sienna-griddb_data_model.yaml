# ---------------------------------------------------------------------------
# 2. What It Is & What It Covers
# ---------------------------------------------------------------------------
summary:
  description: |
    The Sienna Data Model is a language-agnostic schema specification for power
    systems modeling, defined as JSON Schema (Draft-07) with OpenAPI 3.1.0
    specifications in the SiennaSchemas repository. SiennaSchemas is the single
    source of truth from which language-specific implementations are automatically
    generated for Python (Pydantic), Julia (OpenAPIModels), and others if needed.
    SiennaGridDB provides the database backend (SQLite 3.45+ with JSONB) and
    time series management (HDF5). PowerSystems.jl is a specific Julia
    implementation within the Sienna ecosystem, but it is not a required
    dependency for adoption — any language with a SQLite driver or JSON Schema
    library can consume the schema directly.

    Architecture Overview:

                        ┌─────────────────────────────────┐
                        │         SiennaGridDB            │
                        │  (SQLite 3.45+ / JSONB + HDF5)  │
                        │   Persistent Storage & Queries  │
                        └────────────────┬────────────────┘
                                         │ reads / writes
                                         ▼
                        ┌─────────────────────────────────┐
                        │     Auto-Generated Models       │
                        │  ┌───────────┐  ┌─────────────┐ │
                        │  │  Python   │  │    Julia    │ │
                        │  │ (Pydantic)│  │  (OpenAPI)  │ │
                        │  └───────────┘  └─────────────┘ │
                        │  ┌───────────┐  ┌─────────────┐ │
                        │  │  SQL DDL  │  │  Others ... │ │
                        │  └───────────┘  └─────────────┘ │
                        └────────────────┬────────────────┘
                                         │ generated from
                                         ▼
                        ┌─────────────────────────────────┐
                        │        SiennaSchemas            │
                        │  (JSON Schema / OpenAPI 3.1.0)  │
                        │   Single Source of Truth        │
                        │                                 │
                        │  ┌──────┐ ┌────────┐ ┌────────┐ │
                        │  │ Core │ │  Ops   │ │ Invest │ │
                        │  └──────┘ └────────┘ └────────┘ │
                        │          ┌────────┐             │
                        │          │Dynamics│             │
                        │          └────────┘             │
                        └─────────────────────────────────┘

    Data Flow — From Database to Application:

     ┌──────────────────────────────────────────────────────────────────┐
     │                         SiennaGridDB                             │
     │               (SQLite 3.45+ / JSONB + HDF5)                      │
     │           Canonical base data lives here                         │
     └──────────────────────────┬───────────────────────────────────────┘
                                │
                                │  query & extract
                                ▼
     ┌──────────────────────────────────────────────────────────────────┐
     │              Case Generator  (application-specific)              │
     │                                                                  │
     │   Reads base data from the DB, applies study-specific filters,   │
     │   scenarios, and transformations, then writes:                   │
     │     • JSON files  (OpenAPI-conformant component data)            │
     │     • HDF5 files  (time series arrays)                           │
     └───────────┬──────────────────────────────────┬───────────────────┘
                 │                                  │
                 ▼                                  ▼
          ┌─────────────┐                   ┌──────────────┐
          │  JSON files │                   │  HDF5 files  │
          │  (OpenAPI   │                   │  (time series│
          │   models)   │                   │   data)      │
          └──────┬──────┘                   └──────┬───────┘
                 │           consumed by           │
                 ▼                                 ▼
     ┌──────────────────────────────────────────────────────────────────┐
     │                     Applications                                 │
     │                                                                  │
     │   Any tool that can read JSON + HDF5 can consume the data:       │
     │                                                                  │
     │   ┌──────────────────────────────────────────────────────────┐   │
     │   │  Sienna-specific implementations (Julia)                 │   │
     │   │    • PowerSystems.jl                                     │   │
     │   │    • PowerSystemsInvestmentsPortfolios.jl                │   │
     │   │  (These wrap the OpenAPI models in Sienna's own Julia    │   │
     │   │   type hierarchy — they are NOT required for adoption)   │   │
     │   └──────────────────────────────────────────────────────────┘   │
     │                                                                  │
     │   ┌──────────────────────────────────────────────────────────┐   │
     │   │  Any other consumer                                      │   │
     │   │    • Python scripts using Pydantic models                │   │
     │   │    • PyPSA, or other tools via JSON/HDF5                 │   │
     │   │    • Custom applications in any language                 │   │
     │   └──────────────────────────────────────────────────────────┘   │
     └──────────────────────────────────────────────────────────────────┘

  modeling_domains_supported: |
    - Capacity expansion (nodal/zonal): investment modeling with supply, storage,
      and demand-side technologies; financial parameters; policy requirements
      (carbon caps, RPS, capacity reserve margins, minimum/maximum capacity)
    - Production cost (nodal): unit commitment with thermal multi-start,
      piecewise-linear and quadratic cost curves, ramp constraints, time
      constraints (min up/down time)
    - Production cost (zonal): transmission interchange limits, area/load zone
      aggregation
    - Bulk power flow (steady-state): AC bus models, branch impedance (lines,
      2W/3W transformers, tap changers, phase-shifting transformers), HVDC
      (VSC, LCC, TModel). YBus validated for WECC and EI datasets.
    - Dynamic simulation: generator dynamic components (round rotor machines,
      excitation systems, turbine governors), inverter dynamic components
      (renewable energy converters, active/reactive controllers, current control)
    - Hydro modeling: dispatch, reservoirs with elevation and spillage, turbines
      with upstream/downstream reservoir topology
    - Storage: battery and pumped-hydro with efficiency, cycle limits, and
      state-of-charge tracking
    - Services: AGC, constant and variable reserves (up/down) as well as reserve groups
    - Explicit outage representation: geometric distribution forced outages, planned outages,
      fixed forced outages attachable to any component
    - Supplemental attributes: plant-level groupings of generators,
      geographic information, impedance correction data for transformers.
    - Market Bid representation and ORDC for market modeling.

  what_does_it_NOT_cover: |
    - Distribution-level modeling (no phase-level detail, no split-phase)
    - Multi-energy/sector coupling (electricity only; no gas, heat, hydrogen)
    - Model specific constraints or parameters like custom constraints or device formulations.
    - Black Box Dynamic Models like specific manufacturer binaries

  data_captured: |
    - Grid topology (AC/DC buses, arcs, areas, load zones, balancing topologies)
    - Device parameters (thermal/renewable/hydro generators, storage units,
      loads, FACTS devices, synchronous condensers)
    - Branch parameters (lines, transformers, HVDC links with ratings and
      impedance)
    - Cost structures (linear, quadratic, piecewise-linear, piecewise-step
      cost curves; fuel curves; multi-stage startup costs)
    - Time series (load profiles, renewable availability, operational data
      via HDF5 with metadata references in SQLite)
    - Investment data (supply/storage/demand-side technologies, financial
      parameters, existing capacity, retirement/retrofit potential)
    - Dynamic model parameters (machine, exciter, governor, inverter
      controller components)
    - Policy and requirements (carbon caps/tax, energy share requirements,
      hourly matching, capacity reserve margins)
    - Supplemental attributes: many-to-many relationships between
      components and metadata objects including:
      - Power plants (ThermalPowerPlant, HydroPowerPlant,
        RenewablePowerPlant, CombinedCycleBlock, CombinedCycleFractional)
        that group individual generating units by physical coupling
        (shared shafts, penstocks, points of common coupling, HRSGs)
      - Outage models (GeometricDistributionForcedOutage, PlannedOutage,
        FixedForcedOutage) attachable to any component
      - Geographic information (GeoJSON-based coordinates on buses)
      - Impedance correction data for transformers

  conceptual_structure: |
    Flat, non-hierarchical component definitions — no inheritance tree or
    class hierarchy is imposed on adopters. This is a deliberate design
    choice: each component type (generator, line, bus, etc.) is a
    self-contained schema definition with its own fields. Adopters are free
    to organize these components into whatever abstraction hierarchy their
    existing library already uses (e.g., Julia abstract types, Python class
    inheritance, relational tables) without being forced to mirror a
    hierarchy dictated by the schema. This dramatically lowers the adoption
    barrier because teams do not need to restructure their codebase to
    conform to an imposed type tree.

    The schema is organized into four domain packages with a clear
    dependency structure:
    - Core (no dependencies): shared enumerations (ACBusType, PrimeMovers,
      ThermalFuels, StorageTech), cost models, curve types, unit system
    - Operations (depends on Core): topology, branches, static injection
      devices, services
    - Investments (depends on Core): technologies, financials, requirements,
      attributes, regions, portfolio
    - Dynamics (depends on Core): generator and inverter dynamic components

    Discriminated unions (oneOf with discriminator) support polymorphic types
    (e.g., multiple cost types distinguished by cost_type field) without
    requiring a shared base class. In the database layer (SiennaGridDB), a
    central polymorphic entities table with type references enables uniform
    querying across all component types while remaining agnostic to how the
    adopter structures those types in their own code.

    The current implementation focuses on HTTP/OpenAPI as the validation and
    data transfer protocol out of convenience, but the underlying JSON Schema
    definitions do not preclude other protocols. Because the schemas are
    maintained in standard JSON Schema, they could be used to auto-generate models for
    RPC-style protocols (e.g., gRPC/Protobuf, Apache Thrift, Cap'n Proto)
    or other serialization frameworks if performance or streaming
    requirements demand it in the future.

# ---------------------------------------------------------------------------
# 3. Key Design Decisions
# ---------------------------------------------------------------------------
design:
  key_decisions:
    - decision: No imposed type hierarchy — flat, composable component definitions
      rationale: >
        The schema deliberately avoids prescribing an inheritance tree or
        class hierarchy. Each component is a self-contained definition.
        Adopters map these flat definitions onto whatever abstractions their
        existing library already uses (abstract types in Julia, class
        hierarchies in Python, relational tables in SQL, interfaces in Go).
        This means a tool like GenX, PyPSA, or any other project can adopt
        SiennaSchemas without restructuring their internal data model —
        they only need to map fields, not conform to an imposed object
        hierarchy.
    - decision: Language-agnostic JSON Schema as single source of truth
      rationale: >
        Enables automatic code generation for multiple languages (Python,
        Julia, SQL) from one canonical definition, preventing schema drift
        and allowing adoption without dependency on any specific language
        runtime. Teams can use the schema in whichever language fits their
        workflow.
    - decision: PowerSystems.jl is an implementation, not a requirement
      rationale: >
        PowerSystems.jl is the mature Julia implementation for Sienna, but
        the schema is defined independently so that Python, Rust, or any other
        language ecosystem can adopt SiennaSchemas without requiring Julia.
        This lowers the barrier to adoption for non-Julia teams.
    - decision: Separate schema specification from database implementation
      rationale: >
        SiennaSchemas defines the data contracts; SiennaGridDB implements
        persistent storage. This separation allows the same schema to be
        consumed as in-memory objects, database records, or API payloads.
    - decision: SQLite 3.45+ with JSONB as database backend
      rationale: >
        Self-contained, zero-configuration, universally accessible database.
        Every major language has SQLite drivers. JSONB columns provide
        flexibility for complex nested parameters (cost curves, ramp limits)
        without schema explosion. Time series stored in HDF5 for memory
        efficiency at the data transfer level for multidemansional datasets like forecasts.
    - decision: Modular domain packages (Core, Operations, Investments, Dynamics)
      rationale: >
        Allows selective adoption — a capacity expansion tool only needs
        Core + Investments, a dynamics tool only needs Core + Dynamics.
        Reduces coupling and enables independent evolution of each domain.
    - decision: Discriminated unions for polymorphic types
      rationale: >
        Cost models, curve types, and device types use oneOf with
        discriminator fields, enabling type-safe polymorphism that works
        across JSON Schema, Pydantic, Julia structs, and SQL alike.
    - decision: Automated code generation pipeline with schema versioning
      rationale: >
        Downstream repositories (Python and Julia for now ) automatically detect
        new schema releases via polling and open PRs with regenerated code.
        Prevents manual synchronization errors across the ecosystem.
    - decision: Supplemental attributes for cross-component relationships
      rationale: >
        Power systems data requires many-to-many relationships that do not
        fit cleanly into a component's own fields — a power plant groups
        multiple generators by shared physical infrastructure (shafts,
        penstocks, points of common coupling, HRSGs), outage schedules
        attach to arbitrary components, and geographic info attaches to
        buses. These are modeled as supplemental attributes: standalone
        objects with bidirectional UUID-based maps to the components they
        relate to. This pattern is critical for interoperability between
        power flow and production cost modeling — plant objects preserve
        unit-level identity and physical coupling information when
        production cost models aggregate generators. Without this, moving
        from a detailed nodal power flow model to a zonal or aggregated
        production cost model loses the information needed to disaggregate
        results back to individual units. The Julia implementation in
        PowerSystems.jl is mature; SiennaSchemas and SiennaGridDB will
        incorporate these relationship types in an upcoming release.
    - decision: Coherent quantity and unit representation at schema and database level
      rationale: >
        Unit conversion errors are among the most frequent and costly bugs
        in multi-tool power systems workflows. When data moves between a
        capacity expansion tool, a production cost model, and a power flow
        solver, each may silently assume different units for the same
        numeric field. By embedding unambiguous unit metadata at the schema
        and database level, any application reading from SiennaGridDB can
        trust the physical meaning of every value without relying on
        external documentation or implicit conventions. This is an active
        design priority that will make interoperability structurally safe
        rather than convention-dependent.
    - decision: Central polymorphic entities table in database
      rationale: >
        All physical components register in one entities table with type
        references, enabling uniform querying and cross-component
        relationships without knowing the specific device type in advance.

  schema_format: |
    JSON Schema (Draft-07) with OpenAPI 3.1.0 specifications. Schemas are
    organized as individual JSON files per component type. OpenAPI specs
    serve as the intermediate representation for code generation. Generated
    implementations include Pydantic V2 models (Python), Julia structs
    (via openapi-generator), and SQL DDL (SiennaGridDB).

  implementation_languages:
    - Python (Pydantic V2 models via power-openapi-models)
    - Julia (PowerOpenAPIModels.jl, PowerSystems.jl)
    - SQL (SiennaGridDB, SQLite 3.45+)

  database_storage_backend: |
    SQLite 3.45+ with JSONB support (SiennaGridDB). Time series data stored
    in HDF5 files with metadata references in SQLite. Hybrid approach keeps
    the database lightweight while supporting large temporal datasets. No
    PostgreSQL dependency required — SQLite is self-contained and portable.

  interoperability:
    imports_from:
      - JSON (native schema format)
      - CSV (bulk data loading using TableDataParser.jl in the Julia ecosystem)
      - SQL (direct SQLite access from any language)
      - PSS/E RAW and PSSE data formats (via PowerFlowDataParser.jl parsers)
      - MATPOWER case files (via PowerFlowDataParser.jl parsers)
    exports_to:
      - JSON (native)
      - SQL (SQLite database files)
      - HDF5 (time series)

  data_tool_relation: Data only

  extensibility: |
    The schema is extended by adding new JSON Schema files to SiennaSchemas
    and regenerating downstream implementations. The modular package
    structure (Core/Operations/Investments/Dynamics) allows new domains to
    be added without modifying existing ones. Discriminated unions support
    new type variants without breaking existing schemas. JSONB columns in
    SiennaGridDB accept flexible nested structures, enabling parameter
    evolution without database migrations. The OpenAPI code generation
    pipeline propagates extensions to all language implementations
    automatically. Supplemental attributes (power plants, outages,
    geographic info) are the primary mechanism for extending the
    relationship model — new relationship types can be added without
    modifying existing component schemas.

  units_handling: |
    Coherent quantity and unit representation at the schema and database
    level is one of the most important active design priorities. Unit
    conversion errors are among the most common and costly sources of bugs
    when moving data between applications (e.g., a capacity expansion tool
    producing MW values consumed by a power flow tool expecting per-unit).
    The goal is to make it structurally impossible for data to leave the
    database in ambiguous units, so that any application reading from
    SiennaGridDB can trust the physical meaning of every numeric field
    without relying on external documentation or convention.

    Currently, a dataset-level UnitSystem enumeration provides three
    options: SYSTEM_BASE, DEVICE_BASE, and NATURAL_UNITS. Cost curves and
    fuel curves reference the UnitSystem to determine how power values are
    interpreted (actual megawatts vs. per-unit quantities). Base voltage
    and base power fields on components establish normalization contexts.
    The schema is evolving toward explicit per-field unit metadata at the
    database and JSON Schema level so that quantities are unambiguous
    regardless of which application reads them — eliminating the class of
    interoperability errors that arise when tools silently assume different
    unit conventions for the same numeric field.

  validation_approach: |
    Multi-layer validation:
    (1) JSON Schema level — type constraints, required fields, enumerations,
    discriminated union enforcement.
    (2) Pydantic V2 runtime validation — field types, required/optional,
    cross-field validators in the Python implementation.
    (3) Database trigger validation — 33 SQLite triggers in SiennaGridDB
    enforce entity existence (child tables must reference entities table),
    arc relationship integrity (endpoints must reference topology entities),
    hydro system constraints (single upstream/downstream reservoir per
    turbine), and reverse cascade deletion for referential integrity.
    (4) JSON column validation (in progress) — CHECK constraints for 18
    JSON columns covering min/max bounds, ramp constraints, and complex
    cost structures.
    (5) Domain specific validations are left to the adopting libraries. For instance, is the load
    larger than the installed capacity? Are the cost curves convex? These are important but
    not universally applicable, so they are not enforced at the schema or database level. Validations
    for this issues are implemented in PowerSystems.jl and can be adopted by other implementations as needed.

  governance: |
    NLR-led development team with open-source repositories on GitHub.
    Contributions via pull requests with review. Schema releases follow
    semantic versioning and trigger automated code generation across all
    downstream implementations. No formal RFC process; decisions driven by
    the Sienna development team at NLR.

